{{ define "content" }}

<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold">ライブ編集
  </h2>

  <div class="flex gap-3">
    <a href="/lives"
      class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
      ← ライブ一覧へ戻る
    </a>
  </div>
</div>

<div class="flex gap-4 mt-6">

  <form action="/lives/update" method="POST" onsubmit="return confirmUpdate();" class="space-y-4">
    <input type="hidden" name="id" value="{{.ID}}">

    <div>
      <label class="block mb-1 font-medium">日付</label>
      <input type="date" name="date" value="{{.Date}}" required class="w-full border rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block mb-1 font-medium">アーティスト</label>
      <select name="artist" required class="w-full border rounded-lg px-3 py-2">
        <option value="乃木坂46" {{if eq .Artist "乃木坂46"}}selected{{end}}>乃木坂46</option>
        <option value="櫻坂46" {{if eq .Artist "櫻坂46"}}selected{{end}}>櫻坂46</option>
        <option value="日向坂46" {{if eq .Artist "日向坂46"}}selected{{end}}>日向坂46</option>
      </select>
    </div>

    <div>
      <label class="block mb-1 font-medium">会場</label>
      <input type="text" name="venue" value="{{.Venue}}" required class="w-full border rounded-lg px-3 py-2">
    </div>

    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
      更新する
    </button>
  </form>

  <form action="/lives/delete" method="POST" onsubmit="return confirmDelete();" class="self-end">
    <input type="hidden" name="live_id" value="{{.ID}}">
    <button type="submit" class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
      削除する
    </button>
  </form>

</div>


{{ end }}
